<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment received — Homaatri</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(160deg, #FFF8F0 0%, #FFF3E4 100%);
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
    color: #3E2723;
  }
  .card {
    background: #fff; max-width: 420px; width: 100%; border-radius: 20px;
    padding: 40px 32px; text-align: center;
    box-shadow: 0 10px 40px rgba(121, 85, 72, 0.15);
  }
  .tick {
    width: 76px; height: 76px; border-radius: 50%; margin: 0 auto 20px;
    background: #E8F5E9; display: flex; align-items: center; justify-content: center;
    font-size: 38px;
  }
  h1 { font-size: 22px; margin-bottom: 10px; }
  p { font-size: 15px; line-height: 1.55; color: #5D4037; margin-bottom: 8px; }
  .wa-hint { margin-top: 18px; padding: 12px 16px; background: #E8F5E9; border-radius: 12px; font-size: 14px; color: #2E7D32; }
  .brand { margin-top: 22px; font-size: 13px; color: #A1887F; letter-spacing: 0.4px; }
</style>
</head>
<body>
  <div class="card">
    <div class="tick">✅</div>
    <h1>Payment received!</h1>
    <p>Your order is being confirmed on our side.</p>
    <div class="wa-hint">💬 Go back to WhatsApp — your order confirmation is on its way there within a minute.</div>
    <div class="brand">HOMAATRI · home-cooked happiness</div>
  </div>
  <script>
    // Razorpay appends payment_link_id & payment_link_status to the callback URL.
    // Ping the backend so it verifies + settles the payment right away and sends
    // the WhatsApp confirmation (this also wakes a cold Cloud Run instance).
    (function () {
      var qs = new URLSearchParams(window.location.search);
      var plink = qs.get("payment_link_id");
      var st = qs.get("payment_link_status");
      if (plink && (!st || st === "paid")) {
        fetch("https://api.homatri.com/payments/check?payment_link_id=" + encodeURIComponent(plink))
          .catch(function () {});
      }
    })();
  </script>
</body>
</html>
