<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homaatri — WhatsApp Web Concierge Simulator</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --wa-bg-dark: #0b141a;
            --wa-panel-dark: #111b21;
            --wa-header-dark: #202c33;
            --wa-bubble-in: #202c33;
            --wa-bubble-out: #005c4b;
            --wa-teal: #00a884;
            --wa-teal-hover: #029071;
            --wa-text-primary: #e9edef;
            --wa-text-secondary: #8696a0;
            --wa-border: #222d34;
            --wa-input-bg: #2a3942;
            --wa-accent-blue: #53bdeb;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--wa-bg-dark);
            color: var(--wa-text-primary);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .app-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            max-width: 1400px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            background-color: var(--wa-panel-dark);
        }

        @media (min-width: 1024px) {
            .app-container {
                height: 94vh;
                border-radius: 12px;
                overflow: hidden;
            }
        }

        /* Top Role Switcher Header */
        .portal-bar {
            background-color: var(--wa-header-dark);
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--wa-border);
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--wa-text-primary);
        }

        .brand-logo span {
            color: var(--wa-teal);
        }

        .role-tabs {
            display: flex;
            gap: 8px;
            background: rgba(0,0,0,0.2);
            padding: 4px;
            border-radius: 8px;
        }

        .role-btn {
            background: transparent;
            border: none;
            color: var(--wa-text-secondary);
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .role-btn:hover {
            color: var(--wa-text-primary);
            background: rgba(255,255,255,0.05);
        }

        .role-btn.active {
            background-color: var(--wa-teal);
            color: #ffffff;
            box-shadow: 0 2px 8px rgba(0, 168, 132, 0.4);
        }

        .main-chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #0b141a url("data:image/svg+xml,%3Csvg width='80' height='80' viewBox='0 0 80 80' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%23111b21' fill-opacity='0.4' fill-rule='evenodd'%3E%3Cpath d='M0 0h40v40H0V0zm40 40h40v40H40V40z'/%3E%3C/g%3E%3C/svg%3E");
            position: relative;
        }

        /* Active Chat Header */
        .chat-header {
            background-color: var(--wa-header-dark);
            padding: 10px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--wa-border);
            z-index: 10;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00a884, #075e54);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.1rem;
            color: white;
        }

        .user-details h3 {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--wa-text-primary);
        }

        .user-details p {
            font-size: 0.78rem;
            color: var(--wa-text-secondary);
            margin-top: 2px;
        }

        .status-badge {
            background-color: rgba(0, 168, 132, 0.15);
            color: var(--wa-teal);
            border: 1px solid rgba(0, 168, 132, 0.3);
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        /* Messages Window */
        .messages-container {
            flex: 1;
            padding: 20px 50px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            scroll-behavior: smooth;
        }

        @media (max-width: 768px) {
            .messages-container {
                padding: 15px;
            }
        }

        .message-bubble {
            max-width: 65%;
            padding: 8px 12px 6px 12px;
            border-radius: 8px;
            position: relative;
            font-size: 0.9rem;
            line-height: 1.45;
            word-wrap: break-word;
            box-shadow: 0 1px 2px rgba(0,0,0,0.2);
            animation: fadeIn 0.25s ease-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message-bubble.inbound {
            align-self: flex-start;
            background-color: var(--wa-bubble-in);
            color: var(--wa-text-primary);
            border-top-left-radius: 2px;
        }

        .message-bubble.outbound {
            align-self: flex-end;
            background-color: var(--wa-bubble-out);
            color: #e9edef;
            border-top-right-radius: 2px;
        }

        .message-meta {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 4px;
            margin-top: 4px;
            font-size: 0.7rem;
            color: var(--wa-text-secondary);
        }

        .message-bubble.outbound .message-meta {
            color: rgba(255,255,255,0.6);
        }

        .ticks {
            color: var(--wa-accent-blue);
            font-weight: bold;
        }

        /* Map Links in Bubble */
        .map-link-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(0, 168, 132, 0.2);
            color: var(--wa-teal);
            border: 1px solid var(--wa-teal);
            padding: 6px 12px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.82rem;
            margin-top: 8px;
            transition: background 0.2s ease;
        }

        .map-link-btn:hover {
            background: rgba(0, 168, 132, 0.35);
        }

        /* Quick Suggestion Chips */
        .chips-container {
            padding: 8px 20px;
            background-color: rgba(17, 27, 33, 0.85);
            backdrop-filter: blur(8px);
            display: flex;
            gap: 8px;
            overflow-x: auto;
            border-top: 1px solid var(--wa-border);
        }

        .chip {
            background-color: var(--wa-header-dark);
            border: 1px solid var(--wa-border);
            color: var(--wa-text-primary);
            padding: 6px 14px;
            border-radius: 16px;
            font-size: 0.8rem;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s ease;
        }

        .chip:hover {
            border-color: var(--wa-teal);
            color: var(--wa-teal);
            background-color: rgba(0, 168, 132, 0.1);
        }

        /* Input Dock Bar */
        .input-bar {
            background-color: var(--wa-header-dark);
            padding: 10px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-top: 1px solid var(--wa-border);
        }

        .input-bar input {
            flex: 1;
            background-color: var(--wa-input-bg);
            border: none;
            outline: none;
            color: var(--wa-text-primary);
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 0.92rem;
        }

        .input-bar input::placeholder {
            color: var(--wa-text-secondary);
        }

        .send-btn {
            background-color: var(--wa-teal);
            border: none;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.1s ease;
        }

        .send-btn:active {
            transform: scale(0.95);
        }

        .loc-btn {
            background-color: var(--wa-input-bg);
            border: 1px solid var(--wa-border);
            width: 42px;
            height: 42px;
            border-radius: 50%;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .loc-btn:hover {
            border-color: var(--wa-teal);
            background-color: rgba(0, 168, 132, 0.2);
        }


        /* Auth Gate Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0,0,0,0.75);
            backdrop-filter: blur(6px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 1;
            transition: opacity 0.3s ease;
        }

        .modal-card {
            background-color: var(--wa-panel-dark);
            border: 1px solid var(--wa-border);
            width: 90%;
            max-width: 420px;
            border-radius: 12px;
            padding: 28px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }

        .modal-card h2 {
            font-size: 1.25rem;
            margin-bottom: 8px;
            color: var(--wa-text-primary);
        }

        .modal-card p {
            font-size: 0.85rem;
            color: var(--wa-text-secondary);
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .modal-card input {
            width: 100%;
            background-color: var(--wa-input-bg);
            border: 1px solid var(--wa-border);
            color: var(--wa-text-primary);
            padding: 12px 14px;
            border-radius: 8px;
            font-size: 1rem;
            margin-bottom: 16px;
            outline: none;
            text-align: center;
            letter-spacing: 1px;
        }

        .modal-card button {
            width: 100%;
            background-color: var(--wa-teal);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .modal-card button:hover {
            background-color: var(--wa-teal-hover);
        }

        .preset-links {
            margin-top: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .preset-btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--wa-border);
            color: var(--wa-text-secondary);
            padding: 8px;
            border-radius: 6px;
            font-size: 0.78rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .preset-btn:hover {
            color: var(--wa-teal);
            border-color: var(--wa-teal);
        }

        /* Typing indicator */
        .typing-indicator {
            display: flex;
            gap: 4px;
            align-items: center;
            padding: 4px 8px;
        }

        .dot {
            width: 6px;
            height: 6px;
            background-color: var(--wa-text-secondary);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1.0); }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Top Navigation / Role Selector -->
        <header class="portal-bar">
            <div class="brand-logo">
                <span>🟢</span> Homaatri Concierge
            </div>
            <nav class="role-tabs">
                <button class="role-btn active" id="tab-customer" onclick="switchPortal('CUSTOMER')">
                    👤 Customer Portal
                </button>
                <button class="role-btn" id="tab-chef" onclick="switchPortal('CHEF')">
                    👨‍🍳 Chef Portal 🔒
                </button>
                <button class="role-btn" id="tab-driver" onclick="switchPortal('DRIVER')">
                    🛵 Driver Portal 🔒
                </button>
            </nav>
        </header>

        <!-- Main WhatsApp Interface -->
        <main class="main-chat-area">
            <div class="chat-header">
                <div class="user-info">
                    <div class="avatar" id="header-avatar">H</div>
                    <div class="user-details">
                        <h3 id="header-title">Customer Concierge</h3>
                        <p id="header-subtitle">+91 9123456789 (Active)</p>
                    </div>
                </div>
                <div class="status-badge" id="role-badge">CUSTOMER ROLE</div>
            </div>

            <!-- Messages Window -->
            <div class="messages-container" id="messages-window">
                <!-- Dynamic Chat Bubbles populate here -->
            </div>

            <!-- Quick Suggestion Chips -->
            <div class="chips-container" id="chips-dock">
                <!-- Dynamic Quick Action Chips populate here -->
            </div>

            <!-- Chat Input Bar -->
            <div class="input-bar">
                <button class="loc-btn" id="loc-btn" title="Send Location (Method A GPS with Method B Fallback)" onclick="sendGPSLocation()">
                    📍
                </button>
                <input type="text" id="chat-input" placeholder="Type a message or delivery address..." onkeypress="handleKeyPress(event)">
                <button class="send-btn" onclick="sendMessage()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                    </svg>
                </button>
            </div>

        </main>
    </div>

    <!-- Phone Verification Modal -->
    <div class="modal-overlay" id="auth-modal" style="display: none;">
        <div class="modal-card">
            <h2 id="modal-title">Enter Phone Number</h2>
            <p id="modal-desc">Please enter your registered 10-digit phone number to log into this portal.</p>
            <input type="text" id="modal-phone-input" placeholder="e.g. 9876543210" maxlength="10">
            <div id="modal-error" style="color: #ff5b5b; font-size: 0.8rem; margin-bottom: 12px; display: none;"></div>
            <button onclick="submitPhoneAuth()">Access Portal</button>
            
            <div class="preset-links" id="modal-presets">
                <!-- Preset demo buttons inserted dynamically -->
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://' + window.location.host + '/api/v1';

        let currentRole = 'CUSTOMER';
        let currentPhone = null;
        let isSending = false;

        const rolePresets = {
            'CUSTOMER': [
                { label: 'View Lunch Menu', text: 'Hi, show me today\'s lunch menu' },
                { label: 'Order Jain Paneer Tikka', text: 'I want to order Jain Paneer Tikka Tiffin for lunch' },
                { label: 'Check Active Order Status', text: 'What is the status of my active order?' },
                { label: 'Cancel Active Order', text: 'I want to cancel my active order' }
            ],
            'CHEF': [
                { label: 'View Lunch Batch Checklist', text: 'Show my lunch batch preparation checklist' },
                { label: 'Extend Cutoff (+15 mins)', text: 'Extend batch preparation cutoff by 15 minutes due to delay' },
                { label: 'Get Driver ETA', text: 'What is the estimated arrival time of my assigned driver?' }
            ],
            'DRIVER': [
                { label: 'View Active Route', text: 'Show my assigned delivery route and stop details' },
                { label: 'Report Delay at Stop 2', text: 'Report a 10 minute gate delay at Stop 2' },
                { label: 'Confirm Delivery', text: 'Confirm arrival and package delivery at current stop' }
            ]
        };

        // Initialize App on load with Auth Popup
        window.addEventListener('DOMContentLoaded', () => {
            openAuthModal('CUSTOMER');
        });

        function switchPortal(role) {
            openAuthModal(role);
        }

        function openAuthModal(role) {
            const modal = document.getElementById('auth-modal');
            const title = document.getElementById('modal-title');
            const desc = document.getElementById('modal-desc');
            const presets = document.getElementById('modal-presets');
            const phoneInput = document.getElementById('modal-phone-input');
            const errDiv = document.getElementById('modal-error');

            errDiv.style.display = 'none';
            phoneInput.value = '';

            if (role === 'CUSTOMER') {
                title.innerText = '👤 Customer Portal Login';
                desc.innerText = 'Enter your 10-digit phone number to start chatting with Homaatri Customer Concierge.';
                presets.innerHTML = `
                    <div style="font-size:0.75rem; color:#8696a0; margin-bottom:4px;">Demo Quick Preset:</div>
                    <button class="preset-btn" onclick="fillModalPhone('9123456789')">Customer Ramesh (9123456789)</button>
                `;
            } else if (role === 'CHEF') {
                title.innerText = '👨‍🍳 Authorized Chef Login';
                desc.innerText = 'Enter your registered Home Chef phone number to access batch checklists & capacity management.';
                presets.innerHTML = `
                    <div style="font-size:0.75rem; color:#8696a0; margin-bottom:4px;">Demo Quick Presets:</div>
                    <button class="preset-btn" onclick="fillModalPhone('9876543210')">Chef Sunita (9876543210)</button>
                `;
            } else if (role === 'DRIVER') {
                title.innerText = '🛵 Authorized Driver Login';
                desc.innerText = 'Enter your registered Delivery Driver phone number to access active routes & stop navigation.';
                presets.innerHTML = `
                    <div style="font-size:0.75rem; color:#8696a0; margin-bottom:4px;">Demo Quick Presets:</div>
                    <button class="preset-btn" onclick="fillModalPhone('9111222333')">Driver Vikram (9111222333)</button>
                `;
            }
            modal.setAttribute('data-target-role', role);
            modal.style.display = 'flex';
        }

        function fillModalPhone(phone) {
            document.getElementById('modal-phone-input').value = phone;
        }

        async function submitPhoneAuth() {
            const modal = document.getElementById('auth-modal');
            const targetRole = modal.getAttribute('data-target-role');
            const phone = document.getElementById('modal-phone-input').value.trim();
            const errDiv = document.getElementById('modal-error');

            if (!phone || phone.length < 10) {
                errDiv.innerText = 'Please enter a valid 10-digit phone number.';
                errDiv.style.display = 'block';
                return;
            }

            if (targetRole === 'CUSTOMER') {
                modal.style.display = 'none';
                initPortal('CUSTOMER', phone, `Customer ${phone.slice(-4)}`);
                return;
            }

            try {
                const res = await fetch(`${API_BASE}/auth/verify_role`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone: phone, requested_role: targetRole })
                });
                const data = await res.json();

                if (data.authorized) {
                    modal.style.display = 'none';
                    initPortal(targetRole, phone, data.name);
                } else {
                    errDiv.innerText = data.message;
                    errDiv.style.display = 'block';
                }
            } catch (err) {
                errDiv.innerText = 'Unable to connect to FastAPI server. Please ensure backend is running.';
                errDiv.style.display = 'block';
            }
        }


        async function initPortal(role, phone, userName = null) {
            currentRole = role;
            currentPhone = phone;

            // Update Tab Highlight
            document.querySelectorAll('.role-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`tab-${role.toLowerCase()}`).classList.add('active');

            // Update Header Information
            document.getElementById('role-badge').innerText = `${role} ROLE`;
            document.getElementById('header-subtitle').innerText = `+91 ${phone} (Active)`;
            
            const titleEl = document.getElementById('header-title');
            const avatarEl = document.getElementById('header-avatar');

            if (role === 'CHEF') {
                titleEl.innerText = userName ? `Chef ${userName}` : 'Chef Concierge';
                avatarEl.innerText = '👨‍🍳';
            } else if (role === 'DRIVER') {
                titleEl.innerText = userName ? `Driver ${userName}` : 'Driver Concierge';
                avatarEl.innerText = '🛵';
            } else {
                titleEl.innerText = userName || 'Customer Concierge';
                avatarEl.innerText = '👤';
            }

            // Render Quick Chips
            renderChips(role);

            // Fetch & Render Chat History
            await loadChatHistory();
        }

        function renderChips(role) {
            const dock = document.getElementById('chips-dock');
            dock.innerHTML = '';
            const chips = rolePresets[role] || [];
            chips.forEach(c => {
                const chipBtn = document.createElement('button');
                chipBtn.className = 'chip';
                chipBtn.innerText = c.label;
                chipBtn.onclick = () => {
                    document.getElementById('chat-input').value = c.text;
                    sendMessage();
                };
                dock.appendChild(chipBtn);
            });
        }

        async function loadChatHistory() {
            const win = document.getElementById('messages-window');
            win.innerHTML = '<div style="text-align:center; color:#8696a0; font-size:0.8rem; margin-top:20px;">Loading chat history...</div>';

            try {
                const res = await fetch(`${API_BASE}/chat/history?phone=${encodeURIComponent(currentPhone)}`);
                const data = await res.json();
                win.innerHTML = '';

                if (data.messages && data.messages.length > 0) {
                    data.messages.forEach(msg => {
                        appendBubble(msg.text, msg.direction === 'INBOUND' ? 'inbound' : 'outbound', msg.created_at);
                    });
                } else {
                    appendBubble(`Welcome to Homaatri ${currentRole} Portal! Send a message to start.`, 'outbound');
                }
            } catch (err) {
                win.innerHTML = '';
                appendBubble(`Connected to Homaatri Engine for +91 ${currentPhone}.`, 'outbound');
            }
        }

        function appendBubble(text, direction, timestampStr = null) {
            const win = document.getElementById('messages-window');
            const bubble = document.createElement('div');
            bubble.className = `message-bubble ${direction}`;

            // Parse text for Google Maps links if present
            let contentHtml = escapeHtml(text);
            const mapMatch = text.match(/https:\/\/www\.google\.com\/maps\/dir\/\?[^\s]+/g);
            if (mapMatch) {
                const mapUrl = mapMatch[0];
                contentHtml = contentHtml.replace(mapUrl, `<a href="${mapUrl}" target="_blank" class="map-link-btn">🗺️ Open Google Maps Route</a>`);
            }

            const timeStr = timestampStr ? new Date(timestampStr).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            bubble.innerHTML = `
                <div>${contentHtml}</div>
                <div class="message-meta">
                    <span>${timeStr}</span>
                    ${direction === 'outbound' ? '<span class="ticks">✓✓</span>' : ''}
                </div>
            `;
            win.appendChild(bubble);
            win.scrollTop = win.scrollHeight;
        }

        function appendTypingIndicator() {
            const win = document.getElementById('messages-window');
            const bubble = document.createElement('div');
            bubble.className = 'message-bubble outbound';
            bubble.id = 'typing-bubble';
            bubble.innerHTML = `
                <div class="typing-indicator">
                    <span style="font-size:0.8rem; color:#8696a0; margin-right:4px;">Concierge is thinking</span>
                    <div class="dot"></div><div class="dot"></div><div class="dot"></div>
                </div>
            `;
            win.appendChild(bubble);
            win.scrollTop = win.scrollHeight;
        }

        function removeTypingIndicator() {
            const el = document.getElementById('typing-bubble');
            if (el) el.remove();
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        }

        async function sendMessage() {
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if (!text || isSending) return;

            isSending = true;
            input.value = '';
            appendBubble(text, 'inbound');
            appendTypingIndicator();

            try {
                const res = await fetch(`${API_BASE}/chat/send`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        phone: currentPhone,
                        message: text,
                        role: currentRole
                    })
                });
                const data = await res.json();
                removeTypingIndicator();

                if (data.reply_message) {
                    appendBubble(data.reply_message, 'outbound');
                } else {
                    appendBubble('🤖 Request processed successfully.', 'outbound');
                }
            } catch (err) {
                removeTypingIndicator();
                appendBubble('🤖 [Error]: Unable to connect to server.', 'outbound');
            } finally {
                isSending = false;
            }
        }

        async function sendGPSLocation() {
            if (isSending) return;

            // Method A: Browser Geolocation API
            if ("geolocation" in navigator) {
                appendBubble("📍 Fetching GPS Location...", "inbound");
                navigator.geolocation.getCurrentPosition(
                    async (position) => {
                        const lat = position.coords.latitude;
                        const lng = position.coords.longitude;
                        const locText = `📍 My Live GPS Location (${lat.toFixed(6)}, ${lng.toFixed(6)})`;
                        await sendLocationPayload(locText, lat, lng);
                    },
                    (error) => {
                        console.warn("Method A GPS failed/denied:", error.message);
                        // Method B Fallback: Prompt user for text address
                        fallbackToTextAddress();
                    },
                    { enableHighAccuracy: true, timeout: 8000 }
                );
            } else {
                // Method B Fallback
                fallbackToTextAddress();
            }
        }

        function fallbackToTextAddress() {
            const userAddress = prompt("📍 Method A (GPS) permission denied or unavailable.\n\nMethod B Fallback: Please enter your delivery address text:");
            if (userAddress && userAddress.trim()) {
                const fullText = `📍 Delivery Address: ${userAddress.trim()}`;
                sendLocationPayload(fullText, null, null);
            }
        }

        async function sendLocationPayload(text, lat, lng) {
            isSending = true;
            appendBubble(text, 'inbound');
            appendTypingIndicator();

            try {
                const res = await fetch(`${API_BASE}/chat/send`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        phone: currentPhone,
                        message: text,
                        role: currentRole,
                        latitude: lat,
                        longitude: lng
                    })
                });
                const data = await res.json();
                removeTypingIndicator();
                if (data.reply_message) {
                    appendBubble(data.reply_message, 'outbound');
                }
            } catch (err) {
                removeTypingIndicator();
                appendBubble('🤖 [Error]: Unable to send location payload.', 'outbound');
            } finally {
                isSending = false;
            }
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
