# ── Homaatri full stack ────────────────────────────────────────────────────
#   docker compose up --build   ->   http://localhost:8000
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: homatri
      POSTGRES_PASSWORD: homatri
      POSTGRES_DB: homatri
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homatri -d homatri"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://homatri:homatri@db:5432/homatri
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
      APP_ENV: production
      DEBUG: "false"
      # Providers (demo/mock by default; override for real Meta + Razorpay)
      WHATSAPP_PROVIDER: mock
      PAYMENT_PROVIDER: demo
      # LLM Provider & GCP / AWS Bedrock settings
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      GCP_PROJECT_ID: ${GCP_PROJECT_ID:-homatri}
      GCP_REGION: ${GCP_REGION:-us-central1}
      GEMINI_MODEL_ID: ${GEMINI_MODEL_ID:-gemini-2.0-flash-001}
      GEMINI_FALLBACK_MODEL_id: ${GEMINI_FALLBACK_MODEL_ID:-gemini-1.5-flash}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      BEDROCK_MODEL_ID: ${BEDROCK_MODEL_ID:-us.meta.llama4-scout-17b-instruct-v1:0}
      BEDROCK_FALLBACK_MODEL_ID: ${BEDROCK_FALLBACK_MODEL_ID:-qwen.qwen3-next-80b-a3b}
      BEDROCK_EMBEDDING_MODEL_ID: ${BEDROCK_EMBEDDING_MODEL_ID:-amazon.titan-embed-text-v2:0}
      LLM_ENABLED: ${LLM_ENABLED:-true}
      WEB_CONCURRENCY: "1"
    volumes:
      - ~/.aws:/home/appuser/.aws:ro
    env_file:
      - .env
    ports:
      - "8000:8000"
    restart: unless-stopped

volumes:
  pgdata:
