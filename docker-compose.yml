version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: homatri_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dinesh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-homatri_pass}
      POSTGRES_DB: ${POSTGRES_DB:-homatri_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dinesh} -d ${POSTGRES_DB:-homatri_db}"]
      interval: 3s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
