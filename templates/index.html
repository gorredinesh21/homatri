<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Homaatri — WhatsApp Food Ordering Demo</title>
  <style>
    /* ============================================================
       Homaatri demo simulator — self-contained, zero external deps.
       Three WhatsApp phones talking to the Homaatri business number.
       Realtime via SSE (/api/stream). WhatsApp-like aesthetic.
       ============================================================ */
    :root {
      --wa-green-dark: #075E54;   /* header / brand green */
      --wa-green-teal: #128C7E;
      --wa-green-light: #25D366;  /* bright accent */
      --wa-chat-bg: #efeae2;      /* chat wallpaper base */
      --wa-bubble-in: #ffffff;    /* incoming (business -> phone) */
      --wa-bubble-out: #d9fdd3;   /* outgoing (phone -> business) */
      --page-bg: #0b141a;
      --panel-bg: #111b21;
      --panel-border: #22323c;
      --text-light: #e9edef;
      --text-dim: #8696a0;
      --link: #027eb5;
      --tick-blue: #53bdeb;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--page-bg);
      color: var(--text-light);
      min-height: 100vh;
      padding: 16px;
    }

    /* ---------- Top header bar ---------- */
    header {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      padding: 14px 20px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    .brand { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 220px; }
    .brand-logo {
      width: 44px; height: 44px; flex-shrink: 0;
      background: linear-gradient(135deg, var(--wa-green-dark), var(--wa-green-light));
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 1.5rem; color: #fff;
      box-shadow: 0 4px 12px rgba(37, 211, 102, 0.3);
    }
    .brand-title { font-size: 1.35rem; font-weight: 800; letter-spacing: -0.02em; }
    .brand-sub { font-size: 0.78rem; color: var(--text-dim); }

    .header-controls { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }

    /* connection status pill */
    .status-pill {
      display: inline-flex; align-items: center; gap: 7px;
      font-size: 0.8rem; font-weight: 600;
      padding: 6px 12px; border-radius: 999px;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--panel-border);
    }
    .status-dot { width: 9px; height: 9px; border-radius: 50%; background: #f0b429; transition: background .3s; }
    .status-pill.connected .status-dot { background: var(--wa-green-light); box-shadow: 0 0 8px var(--wa-green-light); }
    .status-pill.disconnected .status-dot { background: #ef4444; }

    .btn {
      font-family: inherit; font-weight: 600; font-size: 0.85rem;
      padding: 8px 16px; border-radius: 8px; cursor: pointer;
      border: 1px solid transparent; transition: all .15s;
    }
    .btn-reset { background: var(--wa-green-light); color: #04352a; }
    .btn-reset:hover { background: #1fce5c; }
    .btn-ghost { background: transparent; color: var(--text-light); border-color: var(--panel-border); }
    .btn-ghost:hover { background: rgba(255,255,255,0.06); }

    /* ---------- Main layout ---------- */
    .layout {
      display: grid;
      grid-template-columns: 1fr 320px;
      gap: 16px;
      align-items: start;
    }
    @media (max-width: 1100px) { .layout { grid-template-columns: 1fr; } }

    .phones {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }
    @media (max-width: 900px) { .phones { grid-template-columns: 1fr; } }

    /* ---------- Phone frame ---------- */
    .phone {
      background: #000;
      border-radius: 26px;
      padding: 8px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      display: flex; flex-direction: column;
      height: 640px;
    }
    .phone-screen {
      background: var(--wa-chat-bg);
      border-radius: 20px;
      overflow: hidden;
      display: flex; flex-direction: column;
      flex: 1;
    }
    .phone-topbar {
      background: var(--wa-green-dark);
      color: #fff;
      padding: 10px 12px;
      display: flex; align-items: center; gap: 10px;
      flex-shrink: 0;
    }
    .avatar {
      width: 36px; height: 36px; border-radius: 50%;
      background: rgba(255,255,255,0.2);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.1rem; flex-shrink: 0;
    }
    .peer-name { font-weight: 600; font-size: 0.9rem; line-height: 1.1; }
    .peer-sub { font-size: 0.68rem; opacity: 0.85; }
    .peer-role-tag {
      margin-left: auto; font-size: 0.62rem; font-weight: 700;
      padding: 3px 7px; border-radius: 6px;
      background: rgba(255,255,255,0.18); text-transform: uppercase; letter-spacing: .04em;
    }

    /* chat scroll area */
    .chat {
      flex: 1; overflow-y: auto;
      padding: 12px 10px;
      display: flex; flex-direction: column; gap: 6px;
      /* subtle WhatsApp doodle-ish texture using layered gradients (no external image) */
      background-image:
        radial-gradient(rgba(0,0,0,0.03) 1px, transparent 1px);
      background-size: 18px 18px;
    }
    .chat::-webkit-scrollbar { width: 6px; }
    .chat::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.2); border-radius: 3px; }

    .day-sep {
      align-self: center;
      background: #d6e4ce; color: #4a5a4a;
      font-size: 0.68rem; font-weight: 600;
      padding: 4px 10px; border-radius: 8px; margin: 4px 0;
    }

    /* bubbles */
    .bubble {
      max-width: 82%;
      padding: 6px 9px 4px;
      border-radius: 8px;
      font-size: 0.82rem; line-height: 1.35;
      color: #111b21;
      position: relative;
      box-shadow: 0 1px 0.5px rgba(0,0,0,0.13);
      word-wrap: break-word; white-space: pre-wrap;
    }
    .bubble.in  { background: var(--wa-bubble-in);  align-self: flex-start; border-top-left-radius: 0; }
    .bubble.out { background: var(--wa-bubble-out); align-self: flex-end;   border-top-right-radius: 0; }
    .bubble a { color: var(--link); text-decoration: none; font-weight: 600; }
    .bubble a:hover { text-decoration: underline; }
    .bubble-meta {
      display: flex; align-items: center; justify-content: flex-end; gap: 3px;
      font-size: 0.62rem; color: #667781; margin-top: 2px;
    }
    .tick { font-size: 0.7rem; color: #667781; }
    .tick.read { color: var(--tick-blue); }

    /* interactive buttons inside a bubble */
    .wa-buttons { display: flex; flex-direction: column; gap: 5px; margin-top: 6px; }
    .wa-btn {
      background: #fff; color: #027eb5;
      border: 1px solid #d5dbdd;
      border-radius: 7px; padding: 8px;
      font-size: 0.8rem; font-weight: 600; cursor: pointer;
      text-align: center; font-family: inherit;
      transition: background .15s;
    }
    .wa-btn:hover { background: #f0f6f9; }
    .wa-btn:disabled { opacity: .5; cursor: default; }
    .wa-btn .ico { margin-right: 5px; }

    /* location card */
    .loc-card {
      margin-top: 4px; border-radius: 8px; overflow: hidden;
      border: 1px solid #d5dbdd; background: #f5f6f6;
    }
    .loc-map {
      height: 70px;
      background: linear-gradient(135deg, #cfe8d4, #a8d5b5);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.6rem;
    }
    .loc-body { padding: 6px 8px; }
    .loc-name { font-weight: 700; font-size: 0.78rem; }
    .loc-addr { font-size: 0.7rem; color: #667781; }

    /* footer input */
    .composer {
      display: flex; align-items: center; gap: 8px;
      padding: 8px; background: #f0f2f5; flex-shrink: 0;
    }
    .composer input {
      flex: 1; border: none; outline: none;
      background: #fff; border-radius: 20px;
      padding: 9px 14px; font-size: 0.83rem; font-family: inherit; color: #111b21;
    }
    .icon-btn {
      width: 38px; height: 38px; border: none; border-radius: 50%;
      background: var(--wa-green-teal); color: #fff; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.1rem; flex-shrink: 0;
    }
    .icon-btn.loc { background: #6b7d86; font-size: 1rem; }
    .icon-btn:hover { filter: brightness(1.08); }

    /* ---------- Order state panel ---------- */
    .order-panel {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 14px;
      padding: 16px;
      position: sticky; top: 16px;
    }
    .order-panel h3 { font-size: 0.95rem; margin-bottom: 4px; }
    .order-panel .hint { font-size: 0.72rem; color: var(--text-dim); margin-bottom: 12px; }

    .badge {
      display: inline-block; font-size: 0.7rem; font-weight: 700;
      padding: 4px 10px; border-radius: 999px; text-transform: uppercase; letter-spacing: .03em;
    }
    .b-PENDING          { background: rgba(240,180,41,.18); color: #f0b429; }
    .b-AWAITING_PAYMENT { background: rgba(245,158,11,.18); color: #f59e0b; }
    .b-CONFIRMED        { background: rgba(37,211,102,.18); color: #25d366; }
    .b-PREPARING        { background: rgba(59,130,246,.18); color: #60a5fa; }
    .b-READY_FOR_PICKUP { background: rgba(139,92,246,.18); color: #a78bfa; }
    .b-OUT_FOR_DELIVERY { background: rgba(236,72,153,.18); color: #f472b6; }
    .b-DELIVERED        { background: rgba(16,185,129,.28); color: #34d399; }
    .b-CANCELLED        { background: rgba(239,68,68,.18); color: #f87171; }

    .order-code { font-family: ui-monospace, monospace; font-size: 0.85rem; color: var(--text-light); }

    /* status timeline */
    .timeline { margin: 14px 0; display: flex; flex-direction: column; gap: 0; }
    .tl-step { display: flex; align-items: center; gap: 8px; font-size: 0.74rem; color: var(--text-dim); position: relative; padding: 3px 0; }
    .tl-dot {
      width: 12px; height: 12px; border-radius: 50%;
      border: 2px solid var(--panel-border); background: var(--panel-bg); flex-shrink: 0;
    }
    .tl-step.done .tl-dot   { background: var(--wa-green-light); border-color: var(--wa-green-light); }
    .tl-step.done           { color: var(--text-light); }
    .tl-step.current .tl-dot{ background: #f0b429; border-color: #f0b429; box-shadow: 0 0 8px #f0b429; }
    .tl-step.current        { color: #f0b429; font-weight: 700; }

    .items-list { margin: 12px 0; }
    .item-row { display: flex; justify-content: space-between; font-size: 0.78rem; padding: 4px 0; border-bottom: 1px dashed rgba(255,255,255,0.06); }
    .item-row .q { color: var(--text-dim); }
    .totals { margin-top: 8px; font-size: 0.78rem; }
    .totals .row { display: flex; justify-content: space-between; padding: 2px 0; color: var(--text-dim); }
    .totals .row.grand { color: var(--text-light); font-weight: 800; font-size: 0.95rem; border-top: 1px solid var(--panel-border); margin-top: 5px; padding-top: 7px; }

    .kv { font-size: 0.74rem; color: var(--text-dim); margin-top: 8px; }
    .kv b { color: var(--text-light); font-weight: 600; }
    .empty-state { font-size: 0.8rem; color: var(--text-dim); text-align: center; padding: 24px 8px; }
    .change-req { font-size: 0.72rem; margin-top: 6px; padding: 6px 8px; border-radius: 6px; background: rgba(255,255,255,0.04); border-left: 3px solid #f0b429; }
  </style>
</head>
<body>

  <!-- ===================== Header ===================== -->
  <header>
    <div class="brand">
      <div class="brand-logo">H</div>
      <div>
        <div class="brand-title">Homaatri</div>
        <div class="brand-sub">WhatsApp-first home-food ordering — live demo simulator</div>
      </div>
    </div>
    <div class="header-controls">
      <span class="status-pill disconnected" id="statusPill">
        <span class="status-dot"></span>
        <span id="statusText">Connecting…</span>
      </span>
      <button class="btn btn-reset" id="resetBtn">Reset Demo</button>
    </div>
  </header>

  <!-- ===================== Main ===================== -->
  <div class="layout">
    <div class="phones" id="phones"><!-- phone frames injected by JS --></div>

    <!-- Live order state -->
    <aside class="order-panel">
      <h3>Live Order</h3>
      <div class="hint">Most recent order, updated in realtime.</div>
      <div id="orderState">
        <div class="empty-state">No active orders yet.<br>Start by ordering from the Customer phone.</div>
      </div>
    </aside>
  </div>

  <script>
  /* =====================================================================
     Homaatri simulator front-end logic.
     - Three known phones; each is a WhatsApp chat with the business number.
     - SSE (/api/stream) delivers full state snapshots + wa_message + wa_status.
     - We render outbound-business messages as INCOMING (left) bubbles,
       and locally-sent user text/taps as OUTGOING (right) bubbles.
     ===================================================================== */

  // ---- The three hardcoded phones -----------------------------------
  const PHONES = [
    { phone: "+919876543210", name: "Dinesh (Customer)", sub: "Homaatri Business", role: "Customer", avatar: "🧑", isCustomer: true },
    { phone: "+919999888877", name: "Kiran Sharma",      sub: "Sharma's Kitchen",  role: "Chef",     avatar: "👩‍🍳", isCustomer: false },
    { phone: "+918888777766", name: "Suresh Kumar",      sub: "Delivery Partner",  role: "Driver",   avatar: "🏍️", isCustomer: false },
  ];
  // profile_name sent to backend with each send/tap (used for wa profile)
  const PROFILE_NAME = {
    "+919876543210": "Dinesh/Customer",
    "+919999888877": "Kiran Sharma",
    "+918888777766": "Suresh Kumar",
  };
  const KNOWN = new Set(PHONES.map(p => p.phone));

  // De-dupe map so the same wamid is never rendered twice, and so we can
  // update ticks on already-rendered outgoing messages.
  const seenWamids = new Set();        // rendered inbound wamids
  const outgoingByWamid = new Map();   // wamid -> bubble element (for tick updates)

  const chatEls = {};   // phone -> chat scroll element

  // ---------------- Build phone frames --------------------------------
  function buildPhones() {
    const wrap = document.getElementById("phones");
    wrap.innerHTML = "";
    PHONES.forEach(p => {
      const frame = document.createElement("div");
      frame.className = "phone";
      frame.innerHTML = `
        <div class="phone-screen">
          <div class="phone-topbar">
            <div class="avatar">${p.avatar}</div>
            <div>
              <div class="peer-name">${p.name}</div>
              <div class="peer-sub">${p.sub}</div>
            </div>
            <div class="peer-role-tag">${p.role}</div>
          </div>
          <div class="chat" id="chat-${p.phone}"></div>
          <div class="composer">
            ${p.isCustomer ? `<button class="icon-btn loc" title="Share location" data-loc="${p.phone}">📍</button>` : ""}
            <input type="text" placeholder="Type a message" data-input="${p.phone}">
            <button class="icon-btn" title="Send" data-send="${p.phone}">➤</button>
          </div>
        </div>`;
      wrap.appendChild(frame);
      chatEls[p.phone] = frame.querySelector(`#chat-${cssEsc(p.phone)}`);
    });

    // Wire composer events
    wrap.querySelectorAll("[data-send]").forEach(btn =>
      btn.addEventListener("click", () => sendFromInput(btn.getAttribute("data-send"))));
    wrap.querySelectorAll("[data-input]").forEach(inp =>
      inp.addEventListener("keydown", e => { if (e.key === "Enter") sendFromInput(inp.getAttribute("data-input")); }));
    wrap.querySelectorAll("[data-loc]").forEach(btn =>
      btn.addEventListener("click", () => shareLocation(btn.getAttribute("data-loc"))));
  }
  // "+" is valid in querySelector but be safe with escaping
  function cssEsc(s) { return (window.CSS && CSS.escape) ? CSS.escape(s) : s.replace(/([^\w-])/g, "\\$1"); }

  // ---------------- Rendering helpers ---------------------------------
  function nowTime() {
    return new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  }
  function tsTime(ts) {
    if (!ts) return nowTime();
    const d = new Date(ts * 1000);
    return d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  }
  // Turn plain text into HTML with clickable links, escaping everything else.
  function linkify(text) {
    const esc = String(text)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    return esc.replace(/(https?:\/\/[^\s]+)/g,
      '<a href="$1" target="_blank" rel="noopener">$1</a>');
  }
  function scrollToBottom(phone) {
    const el = chatEls[phone];
    if (el) el.scrollTop = el.scrollHeight;
  }

  // Append a bubble; returns the bubble element.
  function addBubble(phone, side, innerHtml, ts, wamid) {
    const el = chatEls[phone];
    if (!el) return null;
    const b = document.createElement("div");
    b.className = "bubble " + side;
    b.innerHTML = innerHtml;
    // meta (time + ticks for outgoing)
    const meta = document.createElement("div");
    meta.className = "bubble-meta";
    meta.innerHTML = `<span>${tsTime(ts)}</span>` + (side === "out" ? ` <span class="tick">✓</span>` : "");
    b.appendChild(meta);
    if (wamid && side === "out") outgoingByWamid.set(wamid, b);
    el.appendChild(b);
    scrollToBottom(phone);
    return b;
  }

  // Render an INCOMING WhatsApp Cloud API message payload onto `target` phone.
  function renderIncoming(target, message, ts) {
    const type = message.type;

    if (type === "text") {
      addBubble(target, "in", linkify(message.text?.body || ""), ts);
      return;
    }

    if (type === "interactive") {
      const it = message.interactive || {};
      if (it.type === "button") {
        const body = linkify(it.body?.text || "");
        const buttons = (it.action?.buttons || []);
        const b = addBubble(target, "in", body, ts);
        appendButtons(b, target, buttons.map(x => ({ id: x.reply?.id, title: x.reply?.title })));
        return;
      }
      if (it.type === "list") {
        const body = linkify(it.body?.text || "");
        const openLabel = it.action?.button || "View options";
        const rows = [];
        (it.action?.sections || []).forEach(sec =>
          (sec.rows || []).forEach(r => rows.push({ id: r.id, title: r.title, description: r.description })));
        const b = addBubble(target, "in", body, ts);
        appendListButton(b, target, openLabel, rows);
        return;
      }
      // unknown interactive subtype -> show body if any
      addBubble(target, "in", linkify(it.body?.text || "[interactive]"), ts);
      return;
    }

    if (type === "location") {
      const loc = message.location || {};
      const lat = loc.latitude, lng = loc.longitude;
      const maps = `https://www.google.com/maps?q=${lat},${lng}`;
      const html = `
        <a class="loc-card" href="${maps}" target="_blank" rel="noopener" style="display:block;text-decoration:none;color:inherit;">
          <div class="loc-map">📍</div>
          <div class="loc-body">
            <div class="loc-name">${escapeHtml(loc.name || "Shared location")}</div>
            ${loc.address ? `<div class="loc-addr">${escapeHtml(loc.address)}</div>` : ``}
            <div class="loc-addr">${lat}, ${lng}</div>
          </div>
        </a>`;
      addBubble(target, "in", html, ts);
      return;
    }

    // fallback
    addBubble(target, "in", `[${escapeHtml(type || "message")}]`, ts);
  }
  function escapeHtml(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

  // Reply buttons under a bubble.
  function appendButtons(bubble, phone, buttons) {
    if (!bubble) return;
    const wrap = document.createElement("div");
    wrap.className = "wa-buttons";
    buttons.forEach(btn => {
      if (!btn.id) return;
      const el = document.createElement("button");
      el.className = "wa-btn";
      el.innerHTML = `<span class="ico">↩</span>${escapeHtml(btn.title || btn.id)}`;
      el.addEventListener("click", () => {
        disableBubbleButtons(wrap);
        tap(phone, btn.id, btn.title || btn.id);
      });
      wrap.appendChild(el);
    });
    bubble.insertBefore(wrap, bubble.querySelector(".bubble-meta"));
  }

  // A single "list" button that expands rows on click.
  function appendListButton(bubble, phone, openLabel, rows) {
    if (!bubble) return;
    const wrap = document.createElement("div");
    wrap.className = "wa-buttons";
    const opener = document.createElement("button");
    opener.className = "wa-btn";
    opener.innerHTML = `<span class="ico">☰</span>${escapeHtml(openLabel)}`;
    wrap.appendChild(opener);
    opener.addEventListener("click", () => {
      if (wrap.dataset.open === "1") return;
      wrap.dataset.open = "1";
      opener.disabled = true;
      rows.forEach(r => {
        if (!r.id) return;
        const el = document.createElement("button");
        el.className = "wa-btn";
        el.style.textAlign = "left";
        el.innerHTML = `<b>${escapeHtml(r.title || r.id)}</b>` +
                       (r.description ? `<br><span style="font-weight:400;color:#667781;font-size:.72rem">${escapeHtml(r.description)}</span>` : "");
        el.addEventListener("click", () => {
          disableBubbleButtons(wrap);
          tap(phone, r.id, r.title || r.id);
        });
        wrap.appendChild(el);
      });
    });
    bubble.insertBefore(wrap, bubble.querySelector(".bubble-meta"));
  }
  function disableBubbleButtons(wrap) {
    wrap.querySelectorAll("button").forEach(b => b.disabled = true);
  }

  // ---------------- Outbound actions (POST) ---------------------------
  async function postJSON(url, body) {
    try {
      const res = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: body ? JSON.stringify(body) : undefined,
      });
      return res.ok ? await res.json().catch(() => ({})) : null;
    } catch (e) {
      console.error("POST failed", url, e);
      return null;
    }
  }

  function sendFromInput(phone) {
    const inp = document.querySelector(`[data-input="${cssEsc(phone)}"]`);
    if (!inp) return;
    const text = inp.value.trim();
    if (!text) return;
    inp.value = "";
    // optimistic outgoing bubble
    addBubble(phone, "out", linkify(text), Date.now() / 1000);
    postJSON("/api/sim/send", { phone, text, profile_name: PROFILE_NAME[phone] || "" });
  }

  function tap(phone, replyId, title) {
    // optimistic outgoing bubble of the tapped title
    addBubble(phone, "out", escapeHtml(title), Date.now() / 1000);
    postJSON("/api/sim/tap", { phone, reply_id: replyId, title });
  }

  function shareLocation(phone) {
    // Fixed demo coordinate near Bengaluru (per spec).
    const latitude = 12.9611, longitude = 77.6387;
    addBubble(phone, "out",
      `<a class="loc-card" href="https://www.google.com/maps?q=${latitude},${longitude}" target="_blank" rel="noopener" style="display:block;text-decoration:none;color:inherit;">
        <div class="loc-map">📍</div>
        <div class="loc-body"><div class="loc-name">My location</div><div class="loc-addr">${latitude}, ${longitude}</div></div>
      </a>`, Date.now() / 1000);
    postJSON("/api/sim/location", { phone, latitude, longitude });
  }

  async function resetDemo() {
    const btn = document.getElementById("resetBtn");
    btn.disabled = true; btn.textContent = "Resetting…";
    await postJSON("/api/reset", null);
    // Clear all chats + de-dupe caches (SSE will push fresh state next).
    Object.keys(chatEls).forEach(p => { if (chatEls[p]) chatEls[p].innerHTML = ""; });
    seenWamids.clear(); outgoingByWamid.clear();
    btn.disabled = false; btn.textContent = "Reset Demo";
  }
  document.getElementById("resetBtn").addEventListener("click", resetDemo);

  // ---------------- Order state panel ---------------------------------
  const STATUS_FLOW = ["PENDING","AWAITING_PAYMENT","CONFIRMED","PREPARING","READY_FOR_PICKUP","OUT_FOR_DELIVERY","DELIVERED"];
  const STATUS_LABEL = {
    PENDING:"Placed", AWAITING_PAYMENT:"Awaiting payment", CONFIRMED:"Confirmed",
    PREPARING:"Preparing", READY_FOR_PICKUP:"Ready for pickup",
    OUT_FOR_DELIVERY:"Out for delivery", DELIVERED:"Delivered"
  };

  function renderOrderPanel(state) {
    const host = document.getElementById("orderState");
    const orders = (state && state.orders) || [];
    if (!orders.length) {
      host.innerHTML = `<div class="empty-state">No active orders yet.<br>Start by ordering from the Customer phone.</div>`;
      return;
    }
    const o = orders[orders.length - 1]; // most recent
    const cancelled = o.status === "CANCELLED";

    // timeline
    let timeline = "";
    if (cancelled) {
      timeline = `<div class="tl-step current"><span class="tl-dot"></span>Cancelled</div>`;
    } else {
      const curIdx = STATUS_FLOW.indexOf(o.status);
      timeline = STATUS_FLOW.map((s, i) => {
        const cls = i < curIdx ? "done" : (i === curIdx ? "current" : "");
        return `<div class="tl-step ${cls}"><span class="tl-dot"></span>${STATUS_LABEL[s]}</div>`;
      }).join("");
    }

    // items
    const items = (o.items || []).map(it =>
      `<div class="item-row"><span><span class="q">${it.quantity}× </span>${escapeHtml(it.name)}</span><span>₹${fmt(it.line_total)}</span></div>`
    ).join("") || `<div class="empty-state" style="padding:8px">No items yet</div>`;

    // change requests
    const changes = (o.change_requests || []).map(c =>
      `<div class="change-req"><b>${escapeHtml(c.type)}</b> · ${escapeHtml(c.status)}<br>${escapeHtml(c.description || "")}</div>`
    ).join("");

    const delivery = o.delivery || {};
    const payment = o.payment || {};

    host.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;">
        <span class="order-code">${escapeHtml(o.code || "")}</span>
        <span class="badge b-${o.status}">${(o.status || "").replace(/_/g," ")}</span>
      </div>
      <div class="timeline">${timeline}</div>
      <div class="items-list">${items}</div>
      <div class="totals">
        <div class="row"><span>Subtotal</span><span>₹${fmt(o.subtotal)}</span></div>
        <div class="row"><span>Delivery fee</span><span>₹${fmt(o.delivery_fee)}</span></div>
        <div class="row grand"><span>Total</span><span>₹${fmt(o.total)}</span></div>
      </div>
      ${o.customer_name ? `<div class="kv">Customer: <b>${escapeHtml(o.customer_name)}</b></div>` : ""}
      ${o.delivery_address ? `<div class="kv">Address: <b>${escapeHtml(o.delivery_address)}</b></div>` : ""}
      ${o.requested_delivery_time ? `<div class="kv">Delivery by: <b>${escapeHtml(o.requested_delivery_time)}</b></div>` : ""}
      ${payment.status ? `<div class="kv">Payment: <b>${escapeHtml(payment.status)}</b>${payment.amount ? ` (₹${fmt(payment.amount)})` : ""}</div>` : ""}
      ${delivery.status ? `<div class="kv">Delivery: <b>${escapeHtml(delivery.status)}</b>${delivery.route_url ? ` · <a href="${delivery.route_url}" target="_blank" rel="noopener" style="color:var(--wa-green-light)">route</a>` : ""}</div>` : ""}
      ${changes ? `<div style="margin-top:10px">${changes}</div>` : ""}
    `;
  }
  function fmt(n){ if (n == null || isNaN(n)) return "0"; return Number(n).toLocaleString("en-IN", { maximumFractionDigits: 2 }); }

  // ---------------- SSE event handling --------------------------------
  function handleEvent(payload) {
    if (!payload || !payload.kind) return;

    if (payload.kind === "state") {
      renderOrderPanel(payload.state || {});
      return;
    }

    if (payload.kind === "wa_message") {
      const target = payload.target;
      if (!KNOWN.has(target)) return;          // ignore unknown phones
      if (payload.wamid && seenWamids.has(payload.wamid)) return; // de-dupe
      if (payload.wamid) seenWamids.add(payload.wamid);
      renderIncoming(target, payload.message || {}, payload.ts);
      return;
    }

    if (payload.kind === "wa_status") {
      // Update tick marks on the matching outgoing bubble (nice-to-have).
      const b = payload.wamid && outgoingByWamid.get(payload.wamid);
      if (!b) return;
      const tick = b.querySelector(".tick");
      if (!tick) return;
      if (payload.status === "sent")      { tick.textContent = "✓";  tick.classList.remove("read"); }
      else if (payload.status === "delivered") { tick.textContent = "✓✓"; tick.classList.remove("read"); }
      else if (payload.status === "read") { tick.textContent = "✓✓"; tick.classList.add("read"); }
      return;
    }
  }

  // ---------------- Connection status ---------------------------------
  function setStatus(connected) {
    const pill = document.getElementById("statusPill");
    const txt = document.getElementById("statusText");
    pill.classList.toggle("connected", connected);
    pill.classList.toggle("disconnected", !connected);
    txt.textContent = connected ? "Connected" : "Reconnecting…";
  }

  // ---------------- SSE with auto-reconnect ---------------------------
  let es = null, reconnectTimer = null;
  function connectStream() {
    if (es) { try { es.close(); } catch(_){} }
    es = new EventSource("/api/stream");

    es.onopen = () => setStatus(true);
    es.onmessage = (ev) => {
      setStatus(true);
      try { handleEvent(JSON.parse(ev.data)); }
      catch (e) { console.error("Bad SSE payload", e, ev.data); }
    };
    es.onerror = () => {
      setStatus(false);
      // EventSource retries automatically, but force a fresh connection
      // after a short delay to recover from a broken stream.
      try { es.close(); } catch(_){}
      clearTimeout(reconnectTimer);
      reconnectTimer = setTimeout(connectStream, 2500);
    };
  }

  // ---------------- Init ----------------------------------------------
  buildPhones();
  // Optional initial paint before the first SSE tick.
  fetch("/api/state").then(r => r.ok ? r.json() : null).then(s => { if (s) renderOrderPanel(s); }).catch(() => {});
  connectStream();
  </script>
</body>
